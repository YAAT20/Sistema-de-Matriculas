{% extends 'base_matriculas.html' %}

{% block content %}
<div class="max-w-md mx-auto p-6 mt-12 bg-white rounded-xl shadow-md border border-gray-100">
    <div class="text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
            <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        
        <h1 class="text-xl font-bold text-gray-900 mb-2">¿Eliminar {{ tipo }}?</h1>
        <p class="text-sm text-gray-500 mb-6">
            Esta acción es irreversible. Se eliminará permanentemente el registro de <strong>"{{ objeto.nombre }}{{ objeto.titulo }}"</strong> y toda su información relacionada.
        </p>
    </div>

    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        
        <a href="javascript:history.back()" 
           class="w-1/2 text-center px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white hover:bg-gray-50 font-medium">
            Cancelar
        </a>
        
        <button type="submit" 
                class="w-1/2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium shadow-sm">
            Confirmar Eliminar
        </button>
    </form>
</div>
{% endblock %}
