version: '3.8'

services:
  web:
    build: .
    container_name: app_matriculas
    restart: always
    expose:
      - "8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=clave_secreta_produccion_cambiar_esto
      - ALLOWED_HOSTS=*
      - DB_NAME=db_matriculas
      - DB_USER=root
      - DB_PASSWORD=RH_SERVER2025
      - DB_HOST=db_central
      - DB_PORT=3306
    volumes:
      - .:/app
      - ./matriculas_static:/app/staticfiles
      - ./matriculas_media:/app/media
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_matriculas
    restart: always
    ports:
      - "8002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./matriculas_static:/app/staticfiles:ro
      - ./matriculas_media:/app/media:ro
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:
    external: true