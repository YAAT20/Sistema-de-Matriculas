upstream django_app {

    server app_matriculas:8000;

}

server {

    listen 80;

    # Permitir subir fotos de hasta 10MB sin error 413

    client_max_body_size 10M;

    location / {

        proxy_pass http://django_app;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Host $host;

        proxy_redirect off;

    }


    location /static/ {

        alias /app/staticfiles/;

    }


    location /media/ {

        alias /app/media/;

    }

}
